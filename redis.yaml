apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7
        args:
          - "--save"
          - ""                      # 🚨 disables snapshots
          - "--appendonly"
          - "no"                    # disable AOF
          - "--stop-writes-on-bgsave-error"
          - "no"                    # 🚨 allow writes even if disk fails
        ports:
        - containerPort: 6379
