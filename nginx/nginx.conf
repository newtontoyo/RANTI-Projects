apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 8080;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /results {
            proxy_pass http://results:5001/results;
        }

        location /vote {
            proxy_pass http://vote:5000/vote;
        }
    }
